name: examora

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: examora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-examora}
      POSTGRES_USER: ${DB_USERNAME:-examora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-examora} -d ${DB_DATABASE:-examora}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: examora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: examora-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyChangeMe}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7701}:7700"
    volumes:
      - meilidata:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    container_name: examora-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  pgdata:
  redisdata:
  meilidata:
